<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="0.5" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f0a26"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>

  <g opacity="0.14">
    <path d="M0 500 Q 160 460 320 500 T 640 500" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M0 540 Q 160 500 320 540 T 640 540" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M0 580 Q 160 540 320 580 T 640 580" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <g opacity="0.16" font-family="monospace" font-size="20" fill="#38bdf8">
    <text x="60" y="120">&lt;developer&gt;</text>
    <text x="60" y="155" opacity="0.6">  .build</text>
    <text x="60" y="190" opacity="0.9">  .solve()</text>
    <text x="60" y="225">  .learn();</text>
    <text x="60" y="260">&lt;/developer&gt;</text>
  </g>

  <g opacity="0.14" font-family="monospace" font-size="20" fill="#a78bfa">
    <text x="440" y="480">{ find: "code" }</text>
    <text x="440" y="520">if (idea) build();</text>
    <text x="440" y="560">while (alive) { code }</text>
  </g>

  <g opacity="0.5">
    <circle cx="180" cy="180" r="52" fill="none" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r" values="46;58;46" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="450" r="70" fill="none" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="r" values="62;78;62" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="320" cy="320" r="205" fill="#0b1224" stroke="url(#chip)" stroke-width="6"/>

  <circle cx="320" cy="262" r="86" fill="url(#fg)" opacity="0.92"/>
  <circle cx="320" cy="262" r="82" fill="#0e1730"/>

  <path d="M320 190 c-34 0 -62 24 -62 54 v8 a62 62 0 1 0 124 0 v-8 c0 -30 -28 -54 -62 -54z" fill="url(#fg)" opacity="0.85"/>
  <circle cx="320" cy="238" r="40" fill="#101a33"/>

  <path d="M158 458 q162 -110 324 0 a196 196 0 0 1 -324 0z" fill="url(#fg)" opacity="0.88"/>
  <rect x="150" y="440" width="340" height="80" rx="130" fill="#0e1730"/>

  <g font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-weight="700">
    <text x="320" y="472" text-anchor="middle" font-size="64" fill="#67e8f9">MG</text>
    <text x="320" y="512" text-anchor="middle" font-size="20" letter-spacing="6" fill="#94a3b8">GOWTHAM</text>
  </g>
</svg>